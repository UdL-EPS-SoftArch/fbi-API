allowed-origins: http://localhost:3000
default-password: password
spring:
  h2:
    console:
      enabled: false
  jpa:
    properties:
      hibernate:
        auto_quote_keyword: true # Columns like "year" or "rank" are SQL reserved words

# Rate limits (US-SEC-02). Override any value with its environment variable,
# e.g. `fly secrets set RATE_LIMIT_PUBLIC=200`, without rebuilding the app.
rate-limit:
  rules:
    public:       { limit: "${RATE_LIMIT_PUBLIC:120}",       window-seconds: "${RATE_LIMIT_PUBLIC_WINDOW:60}" }
    login:        { limit: "${RATE_LIMIT_LOGIN:10}",         window-seconds: "${RATE_LIMIT_LOGIN_WINDOW:900}" }
    registration: { limit: "${RATE_LIMIT_REGISTRATION:5}",   window-seconds: "${RATE_LIMIT_REGISTRATION_WINDOW:3600}" }
    recovery:     { limit: "${RATE_LIMIT_RECOVERY:10}",      window-seconds: "${RATE_LIMIT_RECOVERY_WINDOW:900}" }
    reports:      { limit: "${RATE_LIMIT_REPORTS:10}",       window-seconds: "${RATE_LIMIT_REPORTS_WINDOW:3600}" }

password-reset:
  frontend-url: ${PASSWORD_RESET_FRONTEND_URL:http://localhost:3000/reset-password}
  from: ${PASSWORD_RESET_FROM:no-reply@localhost}
spring.mail.host: ${SMTP_HOST:localhost}
spring.mail.port: ${SMTP_PORT:25}
spring.mail.username: ${SMTP_USERNAME:}
spring.mail.password: ${SMTP_PASSWORD:}
spring.mail.properties.mail.smtp.auth: ${SMTP_AUTH:false}
spring.mail.properties.mail.smtp.starttls.enable: ${SMTP_STARTTLS:false}
spring.mail.properties.mail.smtp.connectiontimeout: 5000
spring.mail.properties.mail.smtp.timeout: 5000
spring.mail.properties.mail.smtp.writetimeout: 5000
